global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-1:8080"]
        labels: { instance: api-1 }
      - targets: ["api-2:8080"]
        labels: { instance: api-2 }
      - targets: ["api-3:8080"]
        labels: { instance: api-3 }
