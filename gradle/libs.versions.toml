[versions]
springBoot = "4.1.1"
jmhPlugin = "0.7.3"

[libraries]
# Every library version below is managed by the Spring Boot BOM so the three
# modules never disagree about Lettuce, Micrometer, JUnit or Testcontainers.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

lettuce = { module = "io.lettuce:lettuce-core" }
snakeyaml = { module = "org.yaml:snakeyaml" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
logback = { module = "ch.qos.logback:logback-classic" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
