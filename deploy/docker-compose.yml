# Full local environment: 3 API replicas behind a shared Redis (via Toxiproxy so
# we can inject faults), Prometheus scraping them, Grafana showing it.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   ALGORITHM=token_bucket docker compose -f deploy/docker-compose.yml up -d api-1 api-2 api-3
#
# Ports: api 8081-8083, redis 6379, toxiproxy api 8474, prometheus 9090, grafana 3000.

name: rate-limiter

x-api: &api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: rate-limiter:local
  environment: &api-env
    PORT: "8080"
    BACKEND: ${BACKEND:-redis}
    REDIS_ADDR: toxiproxy:26379
    REDIS_TIMEOUT: ${REDIS_TIMEOUT:-50ms}
    LIMITS_FILE: /app/configs/limits.yaml
    ALGORITHM: ${ALGORITHM:-}
    FAIL_MODE: ${FAIL_MODE:-}
    LOCAL_SHARE: ${LOCAL_SHARE:-0.34}
  volumes:
    - ../configs/limits.yaml:/app/configs/limits.yaml:ro
  depends_on:
    redis:
      condition: service_healthy
    toxiproxy:
      condition: service_started
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
    interval: 3s
    timeout: 2s
    retries: 30
    start_period: 15s
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["8474:8474", "26379:26379"]
    depends_on: [redis]

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
    ports: ["8081:8080"]

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    ports: ["8082:8080"]

  api-3:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-3
      # Uncomment to demonstrate clock skew with BACKEND=memory:
      # CLOCK_SKEW: 3s
    ports: ["8083:8080"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rate-limiter.json
    volumes:
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # On-demand load generator; not started with `up`.
  #   docker compose -f deploy/docker-compose.yml run --rm loadgen -targets http://api-1:8080,http://api-2:8080,http://api-3:8080 -rps 200 -duration 30s
  loadgen:
    image: rate-limiter:local
    entrypoint: ["java", "-jar", "/app/loadgen.jar"]
    command: ["-targets", "http://api-1:8080,http://api-2:8080,http://api-3:8080"]
    profiles: [tools]
    depends_on: [api-1, api-2, api-3]
